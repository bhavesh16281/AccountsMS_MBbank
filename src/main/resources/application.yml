server:
  port: 8080

spring:
  application:
    name: accounts
  profiles:
    active: prod
  datasource:
    url: jdbc:h2:mem:testdb
    username: ROOT
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  config:
    import: "optional:configserver:http://localhost:8071/"
  rabbitmq:
    host: localhost
    port: 5672
    username: "guest"
    password: "guest"
  cloud:
    stream:
      rabbit:
        binder:
          auto-bind-dlq: false
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ${spring.application.name}
          binder: rabbit
          consumer:
            exchangeType: topic
            max-attempts: 1

management:
  endpoints:
    web:
      exposure:
        include: "*"
